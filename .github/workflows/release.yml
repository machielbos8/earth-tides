name: Build, test and publish

# Tag vX.Y.ZrcN -> TestPyPI; tag vX.Y.Z -> PyPI. Both after the tests pass on the built wheel.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # build and test only

jobs:

  build:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version from a release-candidate tag (vX.Y.ZrcN -> X.Y.ZrcN on TestPyPI)
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, 'rc')
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"$V\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$V\"/" src/earthtides/__init__.py
      - name: Check that a release tag matches the version
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the built wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest matplotlib sympy
          mv src src_not_used     # the tests must import the installed package
      - name: Unit tests
        run: python -m pytest -q -o pythonpath= tests
      - name: Reproduce the paper (quick)
        run: python paper_scripts/run_all.py --quick --installed

  publish_testpypi:
    name: Publish to TestPyPI
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish_pypi:
    name: Publish to PyPI
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
